model = "gpt-5.5"
model_reasoning_effort = "medium"
personality = "pragmatic"

[features]
multi_agent = true

[plugins."github@openai-curated"]
enabled = true

[plugins."caveman@caveman-repo"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[mcp_servers.shadcn]
enabled = false
command = "npx"
args = ["shadcn@latest", "mcp"]

[mcp_servers.browsermcp]
enabled = false
command = "npx"
args = ["-y", "@browsermcp/mcp"]

[mcp_servers.sequential-thinking]
enabled = false
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.shadcnio]
enabled = false
command = "npx"
args = ["-y", "mcp-remote", "https://www.shadcn.io/api/mcp"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.context7.http_headers]
# Set via environment or add manually after stowing — do not commit the real key
CONTEXT7_API_KEY = ""

[projects."/Users/andrematte/.dotfiles"]
trust_level = "trusted"
